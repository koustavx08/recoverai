name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    # Absolute path so it resolves identically for the Prisma CLI (migrate,
    # relative to schema.prisma) and the generated Client at runtime (which
    # packages/database/src/prisma/client.ts would otherwise compute itself
    # — setting it here just makes CI's DB location explicit).
    env:
      DATABASE_URL: "file:${{ github.workspace }}/packages/database/prisma/dev.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates the Prisma client (packages/database needs its generated
      # types to typecheck/build) and applies migrations to a fresh SQLite
      # file — no external database or secret required.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      # Workspace packages resolve each other via their built `dist/*.d.ts`
      # (no TS project references), so build must run before typecheck.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
